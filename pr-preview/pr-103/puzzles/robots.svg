<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Sky Gradient through Window -->
    <linearGradient id="windowSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Floor Gradients for puzzle puzzle variance -->
    <linearGradient id="floorGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="floorGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Metallic Gradients -->
    <linearGradient id="blueMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="orangeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="greenMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <linearGradient id="batteryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Steel / Gear Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- 1. INDOOR WORKSHOP WALL BACKGROUND -->
  <rect x="0" y="0" width="400" height="400" fill="url(#wallGrad)" />

  <!-- Metal wall panel detailing -->
  <path d="M 340,80 L 400,80 M 340,160 L 400,160 M 340,0 L 340,240" stroke="#0f766e" stroke-width="3" fill="none" />
  <circle cx="350" cy="15" r="3" fill="#0f766e" />
  <circle cx="350" cy="95" r="3" fill="#0f766e" />
  <circle cx="350" cy="175" r="3" fill="#0f766e" />

  <!-- 2. CITY VIEW WINDOW (LEFT) -->
  <g id="window">
    <rect x="20" y="90" width="110" height="150" fill="url(#windowSky)" rx="5" stroke="#1e293b" stroke-width="4" />
    <!-- City Skyline Buildings -->
    <rect x="30" y="150" width="25" height="90" fill="#1e3a8a" />
    <rect x="35" y="160" width="6" height="8" fill="#fef08a" />
    <rect x="35" y="180" width="6" height="8" fill="#fef08a" />
    <rect x="60" y="120" width="35" height="120" fill="#312e81" />
    <rect x="68" y="135" width="8" height="12" fill="#fde047" />
    <rect x="80" y="135" width="8" height="12" fill="#fde047" />
    <rect x="68" y="160" width="8" height="12" fill="#fde047" />
    <rect x="100" y="170" width="20" height="70" fill="#1e1b4b" />
    <!-- Window Frame Cross -->
    <line x1="20" y1="160" x2="130" y2="160" stroke="#1e293b" stroke-width="4" />
    <line x1="75" y1="90" x2="75" y2="240" stroke="#1e293b" stroke-width="4" />
  </g>

  <!-- 3. ROOF TRUSS STRUCTURE (TOP) -->
  <g id="roof-truss">
    <path d="M 0,0 L 400,0 L 400,60 L 0,60 Z" fill="none" />
    <path d="M -10,10 L 410,10 L 410,35 L -10,35 Z" fill="url(#orangeMetal)" stroke="#7c2d12" stroke-width="3" />
    <!-- Diagonal Beams -->
    <path d="M 10,35 L 50,10 M 50,10 L 90,35 M 90,35 L 130,10 M 130,10 L 170,35 M 170,35 L 210,10 M 210,10 L 250,35 M 250,35 L 290,10 M 290,10 L 330,35 M 330,35 L 370,10" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 4. LARGE WALL GEAR (RIGHT) -->
  <g transform="translate(300, 140) scale(0.85)">
    <path d="M -15,-50 L 15,-50 L 20,-35 A 40,40 0 0,1 35,-20 L 50,-15 L 50,15 L 35,20 A 40,40 0 0,1 20,35 L 15,50 L -15,50 L -20,35 A 40,40 0 0,1 -35,20 L -50,15 L -50,-15 L -35,-20 A 40,40 0 0,1 -20,-35 Z" fill="url(#orangeMetal)" stroke="#431407" stroke-width="4" />
    <circle cx="0" cy="0" r="22" fill="#0d9488" stroke="#431407" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#115e59" />
  </g>

  <!-- 5. INTERLOCKING GEOMETRIC FLOOR (BOTTOM) -->
  <g id="floor">
    <!-- Left Floor Section -->
    <path d="M 0,280 L 160,260 L 220,330 L 140,400 L 0,400 Z" fill="url(#floorGradLeft)" stroke="#0f172a" stroke-width="3" />
    <!-- Right Floor Section -->
    <path d="M 160,260 L 400,220 L 400,400 L 140,400 L 220,330 Z" fill="url(#floorGradRight)" stroke="#27272a" stroke-width="3" />
    <!-- Floor Pattern Lines -->
    <line x1="0" y1="330" x2="180" y2="300" stroke="#475569" stroke-width="2" stroke-dasharray="8,8" />
    <line x1="250" y1="280" x2="400" y2="350" stroke="#451a03" stroke-width="2" stroke-dasharray="10,6" />
  </g>

  <!-- 6. MAIN WORKBENCH PLATFORM -->
  <g id="workbench">
    <!-- Platform Top -->
    <polygon points="50,250 330,220 360,260 80,295" fill="#f59e0b" stroke="#78350f" stroke-width="3" />
    <!-- Platform Front Edge -->
    <polygon points="80,295 360,260 360,275 80,310" fill="#d97706" stroke="#78350f" stroke-width="3" />
  </g>

  <!-- 7. BACKGROUND OBJECTS ON BENCH -->
  <!-- Open Red Toolbox -->
  <g transform="translate(90, 185)">
    <rect x="0" y="20" width="60" height="35" rx="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="3" />
    <!-- Lid open back -->
    <path d="M 0,20 L -15,-5 L 45,-5 L 60,20 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" />
    <rect x="22" y="32" width="16" height="10" fill="#94a3b8" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Glowing Power Battery Cell (Window ledge) -->
  <g transform="translate(35, 170) scale(0.7)">
    <rect x="0" y="0" width="30" height="50" rx="5" fill="url(#batteryGlow)" stroke="#ca8a04" stroke-width="3" />
    <rect x="10" y="-6" width="10" height="6" fill="#94a3b8" rx="1" />
    <path d="M 18,10 L 10,26 L 16,26 L 12,40 L 22,22 L 16,22 Z" fill="#dc2626" />
  </g>

  <!-- 8. KEY CHARACTER 1: "COGSWELL" (MAIN BLUE ROBOT) -->
  <g id="cogswell" transform="translate(180, 110)">
    <!-- Shadow -->
    <ellipse cx="25" cy="155" rx="35" ry="10" fill="#000000" opacity="0.25" />

    <!-- Left Leg & Foot -->
    <rect x="0" y="105" width="16" height="40" rx="6" fill="url(#blueMetal)" stroke="#1e3a8a" stroke-width="3" />
    <path d="M -5,140 Q 8,130 20,140 L 20,152 L -5,152 Z" fill="url(#orangeMetal)" stroke="#7c2d12" stroke-width="3" />

    <!-- Right Leg & Foot -->
    <rect x="32" y="105" width="16" height="40" rx="6" fill="url(#blueMetal)" stroke="#1e3a8a" stroke-width="3" />
    <path d="M 28,140 Q 41,130 53,140 L 53,152 L 28,152 Z" fill="url(#orangeMetal)" stroke="#7c2d12" stroke-width="3" />

    <!-- Joints (Knees) -->
    <circle cx="8" cy="105" r="6" fill="#facc15" stroke="#a16207" stroke-width="2" />
    <circle cx="40" cy="105" r="6" fill="#facc15" stroke="#a16207" stroke-width="2" />

    <!-- Body Torso -->
    <rect x="-5" y="45" width="58" height="55" rx="10" fill="url(#blueMetal)" stroke="#1e3a8a" stroke-width="3" />
    <!-- Belly Plate -->
    <rect x="5" y="55" width="38" height="35" rx="5" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" />
    <line x1="12" y1="65" x2="36" y2="65" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="73" x2="36" y2="73" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="81" x2="36" y2="81" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" />

    <!-- Left Arm & Hand holding Wrench -->
    <path d="M -5,50 L -20,75 L -15,95" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-20" cy="75" r="5" fill="#facc15" />
    <!-- Wrench Tool -->
    <g transform="translate(-32, 85) rotate(-20)">
      <path d="M 0,0 L 25,0 M 0,-6 L 0,6 M 25,-6 L 25,6" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
      <circle cx="-2" cy="0" r="7" fill="none" stroke="#64748b" stroke-width="4" />
      <circle cx="27" cy="0" r="7" fill="none" stroke="#64748b" stroke-width="4" />
    </g>

    <!-- Right Arm -->
    <path d="M 53,50 L 68,75 L 63,95" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="68" cy="75" r="5" fill="#facc15" />
    <circle cx="63" cy="98" r="7" fill="url(#orangeMetal)" stroke="#7c2d12" stroke-width="2" />

    <!-- Neck -->
    <rect x="17" y="37" width="14" height="10" fill="#64748b" stroke="#1e293b" stroke-width="2" />

    <!-- Head -->
    <rect x="2" y="2" width="44" height="38" rx="12" fill="url(#blueMetal)" stroke="#1e3a8a" stroke-width="3" />
    <!-- Single Big Eye -->
    <circle cx="24" cy="18" r="11" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />
    <circle cx="24" cy="18" r="6" fill="#facc15" />
    <circle cx="24" cy="18" r="3" fill="#0284c7" />
    <circle cx="26" cy="16" r="1.5" fill="#ffffff" />
    <!-- Mouth Grill -->
    <rect x="14" y="31" width="20" height="5" rx="2" fill="#475569" />
    <line x1="18" y1="31" x2="18" y2="36" stroke="#94a3b8" stroke-width="1" />
    <line x1="24" y1="31" x2="24" y2="36" stroke="#94a3b8" stroke-width="1" />
    <line x1="30" y1="31" x2="30" y2="36" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- 9. KEY CHARACTER 2: "SPROCKET" (GREEN TOOL-BOT) -->
  <g id="sprocket" transform="translate(285, 205)">
    <!-- Shadow -->
    <ellipse cx="30" cy="110" rx="30" ry="8" fill="#000000" opacity="0.3" />

    <!-- Tread Base -->
    <rect x="0" y="85" width="60" height="22" rx="10" fill="#334155" stroke="#0f172a" stroke-width="3" />
    <circle cx="12" cy="96" r="6" fill="#94a3b8" stroke="#1e293b" stroke-width="2" />
    <circle cx="30" cy="96" r="6" fill="#94a3b8" stroke="#1e293b" stroke-width="2" />
    <circle cx="48" cy="96" r="6" fill="#94a3b8" stroke="#1e293b" stroke-width="2" />

    <!-- Body Blocks -->
    <rect x="8" y="55" width="44" height="32" rx="4" fill="url(#orangeMetal)" stroke="#7c2d12" stroke-width="3" />
    <rect x="12" y="30" width="36" height="28" rx="4" fill="url(#greenMetal)" stroke="#1a2e05" stroke-width="3" />

    <!-- Glowing Twin Visor Eyes -->
    <rect x="18" y="38" width="24" height="8" rx="3" fill="#15803d" />
    <circle cx="24" cy="42" r="2.5" fill="#4ade80" />
    <circle cx="36" cy="42" r="2.5" fill="#4ade80" />

    <!-- Mechanical Crane Arm with Claw -->
    <path d="M 44,45 L 65,25 L 55,0" fill="none" stroke="url(#orangeMetal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="65" cy="25" r="4" fill="#facc15" />
    <!-- Claw -->
    <path d="M 48,-8 C 45,-18 65,-18 62,-8" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 10. EXTRA DETAILS & SCATTERED HARDWARE FOR PUZZLE INTEREST -->
  <!-- Wire Spool on Table -->
  <g transform="translate(250, 215) scale(0.8)">
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#475569" />
    <rect x="5" y="10" width="30" height="20" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <line x1="5" y1="15" x2="35" y2="15" stroke="#1e293b" stroke-width="1.5" />
    <line x1="5" y1="20" x2="35" y2="20" stroke="#1e293b" stroke-width="1.5" />
    <line x1="5" y1="25" x2="35" y2="25" stroke="#1e293b" stroke-width="1.5" />
    <ellipse cx="20" cy="30" rx="20" ry="6" fill="#334155" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Giant Bolts on Floor -->
  <g transform="translate(60, 310) rotate(15)">
    <rect x="0" y="0" width="12" height="18" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="5" x2="12" y2="5" stroke="#1e293b" stroke-width="1.5" />
    <line x1="0" y1="10" x2="12" y2="10" stroke="#1e293b" stroke-width="1.5" />
    <path d="M -4,-8 L 16,-8 L 20,0 L -8,0 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
  </g>

  <g transform="translate(100, 340) rotate(-35)">
    <rect x="0" y="0" width="12" height="18" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="5" x2="12" y2="5" stroke="#1e293b" stroke-width="1.5" />
    <line x1="0" y1="10" x2="12" y2="10" stroke="#1e293b" stroke-width="1.5" />
    <path d="M -4,-8 L 16,-8 L 20,0 L -8,0 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Loose Floor Gear -->
  <g transform="translate(145, 315) scale(0.5)">
    <path d="M -15,-50 L 15,-50 L 20,-35 A 40,40 0 0,1 35,-20 L 50,-15 L 50,15 L 35,20 A 40,40 0 0,1 20,35 L 15,50 L -15,50 L -20,35 A 40,40 0 0,1 -35,20 L -50,15 L -50,-15 L -35,-20 A 40,40 0 0,1 -20,-35 Z" fill="url(#steelGrad)" stroke="#0f172a" stroke-width="4" />
    <circle cx="0" cy="0" r="18" fill="#64748b" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Cute Mini Robot Vacuum Cleaner on Floor -->
  <g transform="translate(220, 350)">
    <ellipse cx="20" cy="12" rx="22" ry="10" fill="#f472b6" stroke="#9d174d" stroke-width="2.5" />
    <ellipse cx="20" cy="8" rx="22" ry="8" fill="#f472b6" />
    <ellipse cx="20" cy="6" rx="16" ry="5" fill="#fbcfe8" />
    <!-- Bumper & Light -->
    <path d="M 0,12 A 22,10 0 0,0 40,12" fill="none" stroke="#831843" stroke-width="3" />
    <circle cx="20" cy="5" r="2.5" fill="#38bdf8" />
    <!-- Wheels -->
    <ellipse cx="0" cy="14" rx="3" ry="5" fill="#1e293b" />
    <ellipse cx="40" cy="14" rx="3" ry="5" fill="#1e293b" />
  </g>

</svg>
