<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Ocean Water Gradients -->
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Sun & Ray Gradients -->
    <linearGradient id="rayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>

    <!-- Seabed Gradients -->
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Castle Gradients -->
    <linearGradient id="castlePink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="castleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Mermaid Tail Gradients -->
    <linearGradient id="queenTail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="greenTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="purpleTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Reusable Patterns & Components -->
    <pattern id="bubbles" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.5" fill="#ffffff" opacity="0.25"/>
      <circle cx="20" cy="15" r="1.5" fill="#ffffff" opacity="0.2"/>
      <circle cx="12" cy="25" r="3" fill="#ffffff" opacity="0.15"/>
    </pattern>

    <!-- Sparkle -->
    <g id="sparkle">
      <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff"/>
    </g>

    <!-- Fish Templates -->
    <g id="fishYellow">
      <path d="M 0 0 Q 12 -10 24 0 Q 12 10 0 0 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
      <polygon points="24,0 32,-7 32,7" fill="#fb923c" stroke="#ca8a04" stroke-width="1"/>
      <circle cx="6" cy="-1" r="1.5" fill="#1e293b"/>
      <path d="M 12 -4 Q 15 0 12 4" fill="none" stroke="#ca8a04" stroke-width="1"/>
    </g>
    
    <g id="fishBlue">
      <path d="M 0 0 Q 10 -8 20 0 Q 10 8 0 0 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
      <polygon points="20,0 26,-5 26,5" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
      <circle cx="5" cy="-1" r="1.2" fill="#1e293b"/>
    </g>

    <g id="fishPink">
      <path d="M 0 0 Q 8 -6 16 0 Q 8 6 0 0 Z" fill="#f472b6" stroke="#be185d" stroke-width="1"/>
      <polygon points="16,0 22,-4 22,4" fill="#fb7185" stroke="#be185d" stroke-width="1"/>
      <circle cx="4" cy="-1" r="1" fill="#1e293b"/>
    </g>

    <g id="seashell">
      <path d="M 0 10 Q -10 -2 0 -10 Q 10 -2 0 10 Z" fill="#fda4af" stroke="#be185d" stroke-width="1"/>
      <path d="M -6 5 Q 0 -5 6 5" fill="none" stroke="#fecdd3" stroke-width="1"/>
      <path d="M -3 7 Q 0 0 3 7" fill="none" stroke="#fecdd3" stroke-width="1"/>
    </g>

    <g id="starfish">
      <path d="M 0 -8 L 2.5 -2 L 8 -1.5 L 4 2.5 L 5.5 8 L 0 5 L -5.5 8 L -4 2.5 L -8 -1.5 L -2.5 -2 Z" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#fef08a"/>
    </g>
  </defs>

  <!-- ==================== LAYER 1: OCEAN & BACKGROUND ==================== -->
  <rect width="400" height="400" fill="url(#oceanGrad)"/>
  
  <!-- Underwater Sun Rays -->
  <g transform="translate(350, 40)">
    <circle r="35" fill="#fef08a" opacity="0.5"/>
    <circle r="25" fill="#facc15"/>
    <!-- Cute Sun Face -->
    <circle cx="-6" cy="-4" r="2.5" fill="#1e293b"/>
    <circle cx="6" cy="-4" r="2.5" fill="#1e293b"/>
    <path d="M -4 4 Q 0 9 4 4" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-10" cy="2" r="3" fill="#fb923c" opacity="0.6"/>
    <circle cx="10" cy="2" r="3" fill="#fb923c" opacity="0.6"/>
  </g>

  <polygon points="350,40 -20,250 -20,150" fill="url(#rayGrad)"/>
  <polygon points="350,40 50,400 150,400" fill="url(#rayGrad)"/>
  <polygon points="350,40 250,420 350,420" fill="url(#rayGrad)"/>

  <!-- Bubbles Overlay -->
  <rect width="400" height="400" fill="url(#bubbles)"/>

  <!-- Distant Background Fish -->
  <use href="#fishBlue" x="40" y="60" opacity="0.6"/>
  <use href="#fishBlue" x="120" y="30" opacity="0.6" transform="scale(0.8)"/>
  <use href="#fishPink" x="250" y="70" opacity="0.6"/>

  <!-- ==================== LAYER 2: CORAL CASTLE ==================== -->
  <g id="castle" transform="translate(100, 40)">
    <!-- Base Walls -->
    <rect x="25" y="100" width="150" height="80" fill="url(#castlePink)" stroke="#9d174d" stroke-width="1.5"/>
    <!-- Wall Crenellations -->
    <path d="M 25 100 L 35 100 L 35 90 L 45 90 L 45 100 L 55 100 L 55 90 L 65 90 L 65 100 L 135 100 L 135 90 L 145 90 L 145 100 L 155 100 L 155 90 L 165 90 L 165 100 L 175 100" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
    
    <!-- Archway Door -->
    <path d="M 80 180 L 80 140 A 20 20 0 0 1 120 140 L 120 180 Z" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
    <path d="M 85 140 A 15 15 0 0 1 115 140" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Left Tower -->
    <rect x="10" y="70" width="30" height="110" fill="url(#castlePink)" stroke="#9d174d" stroke-width="1.5"/>
    <path d="M 5 70 L 25 20 L 45 70 Z" fill="url(#castleGold)" stroke="#ca8a04" stroke-width="1.5"/>
    
    <!-- Right Tower -->
    <rect x="160" y="70" width="30" height="110" fill="url(#castlePink)" stroke="#9d174d" stroke-width="1.5"/>
    <path d="M 155 70 L 175 20 L 195 70 Z" fill="url(#castleGold)" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Center Spire -->
    <rect x="70" y="40" width="60" height="140" fill="url(#castlePink)" stroke="#9d174d" stroke-width="1.5"/>
    <path d="M 60 40 L 100 -20 L 140 40 Z" fill="url(#castleGold)" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Windows -->
    <rect x="90" y="60" width="20" height="25" rx="10" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="18" y="110" width="14" height="20" rx="7" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="168" y="110" width="14" height="20" rx="7" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Pennant Flags -->
    <line x1="100" y1="-20" x2="100" y2="-40" stroke="#ca8a04" stroke-width="2"/>
    <polygon points="100,-40 120,-33 100,-26" fill="#38bdf8"/>
    <line x1="25" y1="20" x2="25" y2="0" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="25,0 40,5 25,10" fill="#38bdf8"/>
    <line x1="175" y1="20" x2="175" y2="0" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="175,0 190,5 175,10" fill="#38bdf8"/>
  </g>

  <!-- ==================== LAYER 3: SEABED & THRONE ==================== -->
  <path d="M 0 330 Q 150 280 250 340 T 400 320 L 400 400 L 0 400 Z" fill="url(#sandGrad)"/>
  
  <!-- Coral Throne (Center) -->
  <g id="coralThrone" transform="translate(200, 240)">
    <path d="M -40 60 C -60 -20 -10 -40 -30 -80 C -20 -50 0 -20 0 60 Z" fill="#f43f5e" stroke="#be185d" stroke-width="1.5"/>
    <path d="M 40 60 C 60 -20 10 -40 30 -80 C 20 -50 0 -20 0 60 Z" fill="#f43f5e" stroke="#be185d" stroke-width="1.5"/>
    <path d="M -40 60 Q 0 80 40 60 L 30 100 L -30 100 Z" fill="#fb7185" stroke="#be185d" stroke-width="1.5"/>
    <ellipse cx="0" cy="70" rx="45" ry="15" fill="#fda4af" stroke="#be185d" stroke-width="1.5"/>
  </g>

  <!-- ==================== LAYER 4: MERMAIDS (STRICT LAYERING FOR CLEANLINESS) ==================== -->
  
  <!-- ### MERMAID 1: QUEEN (CENTER) ### -->
  <g id="mermaidQueen" transform="translate(200, 230)">
    <!-- 1. Back Hair -->
    <path d="M -15,-40 C -40,-10 -35,30 -40,50 C -10,60 10,60 40,50 C 35,30 40,-10 15,-40 Z" fill="#581c87"/>
    <path d="M -20,20 C -30,50 -20,80 -10,90 C -5,70 -10,40 -10,20 Z" fill="#581c87"/>
    <path d="M 20,20 C 30,50 20,80 10,90 C 5,70 10,40 10,20 Z" fill="#581c87"/>

    <!-- 2. Tail -->
    <!-- Tail Body -->
    <path d="M -13,0 C -15,40 10,60 10,90 C 10,120 -20,140 -30,150 C -10,145 10,130 20,110 C 35,80 15,30 13,0 Z" fill="url(#queenTail)" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Tail Fluke -->
    <path d="M -30,150 C -60,160 -70,120 -80,100 C -50,120 -30,140 -20,135 C -15,170 10,180 20,190 C -5,170 -15,160 -30,150 Z" fill="#f472b6" stroke="#be185d" stroke-width="1.5"/>
    <!-- Waist Belt -->
    <path d="M -13,0 Q 0,10 13,0" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <!-- Scale details -->
    <path d="M -5,15 Q 0,20 5,15 M -8,30 Q -3,35 2,30 M 5,45 Q 10,50 15,45" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.5"/>

    <!-- 3. Torso & Head -->
    <path d="M -12,0 L -9,-25 L 9,-25 L 12,0 Z" fill="#fde047"/>
    <!-- Neck -->
    <rect x="-3" y="-32" width="6" height="8" fill="#fde047"/>
    <!-- Head -->
    <ellipse cx="0" cy="-42" rx="13" ry="14" fill="#fde047"/>
    
    <!-- Shell Bra -->
    <circle cx="-5" cy="-18" r="6" fill="#f43f5e" stroke="#be185d" stroke-width="1"/>
    <circle cx="5" cy="-18" r="6" fill="#f43f5e" stroke="#be185d" stroke-width="1"/>
    <!-- Pearl Necklace -->
    <path d="M -6,-26 Q 0,-20 6,-26" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Face -->
    <circle cx="-5" cy="-42" r="2" fill="#1e293b"/>
    <circle cx="5" cy="-42" r="2" fill="#1e293b"/>
    <circle cx="-6" cy="-43" r="0.8" fill="#ffffff"/>
    <circle cx="4" cy="-43" r="0.8" fill="#ffffff"/>
    <circle cx="-9" cy="-38" r="2" fill="#fb7185" opacity="0.6"/>
    <circle cx="9" cy="-38" r="2" fill="#fb7185" opacity="0.6"/>
    <path d="M -3,-37 Q 0,-34 3,-37" fill="none" stroke="#9f1239" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 4. Front Hair (Bangs & Overlay) -->
    <path d="M -14,-45 C -5,-58 5,-58 14,-45 C 16,-35 10,-35 0,-40 C -10,-35 -16,-35 -14,-45 Z" fill="#4c1d95"/>
    <path d="M -13,-40 C -25,-20 -20,10 -15,20 C -10,5 -15,-20 -10,-35 Z" fill="#4c1d95"/>
    <path d="M 13,-40 C 25,-20 20,10 15,20 C 10,5 15,-20 10,-35 Z" fill="#4c1d95"/>

    <!-- Crown -->
    <path d="M -8,-52 L -12,-62 L -4,-56 L 0,-65 L 4,-56 L 12,-62 L 8,-52 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="0" cy="-58" r="1.5" fill="#38bdf8"/>

    <!-- 5. Arms (Layered over everything) -->
    <path d="M -9,-24 C -25,-15 -35,5 -20,15" fill="none" stroke="#fde047" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 9,-24 C 25,-15 35,5 20,15" fill="none" stroke="#fde047" stroke-width="4.5" stroke-linecap="round"/>
  </g>


  <!-- ### MERMAID 2: GREEN (LEFT) ### -->
  <g id="mermaidGreen" transform="translate(100, 220)">
    <!-- 1. Back Hair -->
    <path d="M 0,-35 C 10,-20 30,-10 40,10 C 25,-5 15,-20 5,-30 Z" fill="#92400e"/>
    
    <!-- 2. Tail (Swimming Left) -->
    <path d="M -8,0 C -10,30 -30,50 -60,30 C -80,15 -90,20 -100,40 C -80,45 -70,30 -60,30 C -30,70 10,40 8,0 Z" fill="url(#greenTail)" stroke="#064e3b" stroke-width="1.5"/>
    <path d="M -100,40 C -120,50 -120,20 -125,5 C -110,20 -105,30 -100,40 Z" fill="#34d399" stroke="#059669" stroke-width="1"/>
    <path d="M -100,40 C -110,65 -90,75 -75,80 C -85,60 -95,50 -100,40 Z" fill="#34d399" stroke="#059669" stroke-width="1"/>
    <path d="M -8,0 Q 0,8 8,0" fill="none" stroke="#facc15" stroke-width="2"/>
    
    <!-- 3. Torso & Head -->
    <path d="M -8,0 L -12,-20 L 5,-23 L 8,0 Z" fill="#fde047"/>
    <rect x="-4" y="-30" width="5" height="8" fill="#fde047" transform="rotate(-15)"/>
    <ellipse cx="-5" cy="-38" rx="12" ry="13" fill="#fde047" transform="rotate(-15)"/>
    
    <!-- Shell Bra -->
    <circle cx="-8" cy="-15" r="5" fill="#a855f7" stroke="#7e22ce" stroke-width="1"/>
    <circle cx="2" cy="-17" r="5" fill="#a855f7" stroke="#7e22ce" stroke-width="1"/>

    <!-- Face -->
    <circle cx="-10" cy="-38" r="1.8" fill="#1e293b"/>
    <circle cx="-1" cy="-40" r="1.8" fill="#1e293b"/>
    <circle cx="-12" cy="-34" r="1.5" fill="#fb7185" opacity="0.6"/>
    <circle cx="2" cy="-37" r="1.5" fill="#fb7185" opacity="0.6"/>
    <path d="M -8,-32 Q -5,-29 -2,-33" fill="none" stroke="#9f1239" stroke-width="1" stroke-linecap="round"/>

    <!-- 4. Front Hair -->
    <path d="M -15,-40 C -25,-20 -30,0 -40,10 C -35,-5 -25,-25 -10,-45 Z" fill="#78350f"/>
    <path d="M -18,-38 C -10,-55 5,-50 5,-40 C 5,-40 -5,-45 -15,-38 Z" fill="#78350f"/>
    <use href="#seashell" x="-12" y="-42" transform="scale(0.6) rotate(-20)"/>

    <!-- 5. Arms -->
    <path d="M -11,-20 C -25,-10 -35,10 -25,25" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <path d="M 4,-21 C 20,-15 35,-5 45,5" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  </g>


  <!-- ### MERMAID 3: PURPLE (RIGHT) ### -->
  <g id="mermaidPurple" transform="translate(310, 230)">
    <!-- 1. Back Hair -->
    <path d="M 5,-35 C -10,-10 -20,10 -30,20 C -15,5 -5,-15 10,-30 Z" fill="#ec4899"/>

    <!-- 2. Tail (Swimming Right) -->
    <path d="M -8,0 C 10,20 30,40 50,20 C 70,0 80,-20 85,-40 C 75,-25 60,-10 50,0 C 30,20 10,30 8,0 Z" fill="url(#purpleTail)" stroke="#7e22ce" stroke-width="1.5"/>
    <!-- Tail Fluke -->
    <path d="M 85,-40 C 105,-50 115,-30 115,-10 C 100,-25 95,-35 85,-40 Z" fill="#f472b6" stroke="#be185d" stroke-width="1"/>
    <path d="M 85,-40 C 95,-65 80,-80 65,-85 C 75,-65 80,-55 85,-40 Z" fill="#f472b6" stroke="#be185d" stroke-width="1"/>
    <path d="M -8,0 Q 0,8 8,0" fill="none" stroke="#facc15" stroke-width="2"/>

    <!-- 3. Torso & Head -->
    <path d="M -8,0 L -5,-22 L 12,-20 L 8,0 Z" fill="#fde047"/>
    <rect x="-1" y="-28" width="5" height="8" fill="#fde047" transform="rotate(10)"/>
    <ellipse cx="2" cy="-38" rx="11" ry="12" fill="#fde047" transform="rotate(10)"/>

    <!-- Shell Bra -->
    <circle cx="-2" cy="-16" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <circle cx="8" cy="-15" r="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>

    <!-- Face -->
    <circle cx="-3" cy="-38" r="1.8" fill="#1e293b"/>
    <circle cx="6" cy="-36" r="1.8" fill="#1e293b"/>
    <circle cx="-6" cy="-33" r="1.5" fill="#fb7185" opacity="0.6"/>
    <circle cx="7" cy="-31" r="1.5" fill="#fb7185" opacity="0.6"/>
    <path d="M -1,-31 Q 2,-28 5,-30" fill="none" stroke="#9f1239" stroke-width="1" stroke-linecap="round"/>

    <!-- 4. Front Hair -->
    <path d="M 12,-40 C 25,-20 30,0 40,10 C 35,-5 25,-25 5,-45 Z" fill="#db2777"/>
    <path d="M 10,-38 C 5,-55 -10,-50 -10,-40 C -10,-40 0,-45 10,-38 Z" fill="#db2777"/>
    <use href="#seashell" x="8" y="-44" transform="scale(0.6) rotate(30)"/>

    <!-- 5. Arms -->
    <path d="M 11,-18 C 25,-10 35,5 25,20" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <path d="M -4,-20 C -20,-15 -35,5 -25,15" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
  </g>


  <!-- ==================== LAYER 5: FOREGROUND CORALS, CHEST & FISH ==================== -->
  
  <!-- Treasure Chest (Bottom Left) -->
  <g id="chest" transform="translate(40, 310)">
    <!-- Base -->
    <rect x="-20" y="20" width="70" height="40" fill="#92400e" stroke="#451a03" stroke-width="2" rx="2"/>
    <rect x="-20" y="20" width="70" height="8" fill="#facc15" stroke="#b45309" stroke-width="1"/>
    <rect x="-20" y="52" width="70" height="8" fill="#facc15" stroke="#b45309" stroke-width="1"/>
    <rect x="10" y="32" width="10" height="12" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <!-- Jewels & Gold -->
    <ellipse cx="15" cy="15" rx="35" ry="15" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="-5" cy="10" r="5" fill="#38bdf8"/>
    <circle cx="5" cy="15" r="4" fill="#ef4444"/>
    <circle cx="20" cy="8" r="6" fill="#4ade80"/>
    <circle cx="35" cy="12" r="5" fill="#c084fc"/>
    <circle cx="15" cy="5" r="5" fill="#f472b6"/>
    <!-- Pearl Necklace Spilling Out -->
    <path d="M -10 25 Q -25 45 5 55 Q 30 65 35 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3,3"/>
    <!-- Open Lid -->
    <path d="M -20 20 C -10 -15 30 -15 50 20 L 45 15 C 30 -15 -5 -15 -15 15 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
    <path d="M -20 20 Q 15 -10 50 20" fill="none" stroke="#facc15" stroke-width="2"/>
  </g>

  <!-- Foreground Fish (Swimming among mermaids) -->
  <use href="#fishYellow" x="110" y="100" transform="scale(1.2)"/>
  <use href="#fishYellow" x="60" y="115"/>
  <use href="#fishYellow" x="150" y="80" transform="scale(0.9)"/>
  
  <use href="#fishBlue" x="280" y="200" transform="scale(1.1)"/>
  <use href="#fishBlue" x="330" y="170" transform="scale(0.8)"/>
  
  <use href="#fishPink" x="150" y="280"/>
  <use href="#fishPink" x="80" y="260" transform="scale(1.2)"/>

  <!-- Seahorses -->
  <use href="#seahorse" x="40" y="170" transform="scale(1.3)"/>
  <use href="#seahorse" x="280" y="320" transform="scale(1.2)"/>

  <!-- Cute Crab (Bottom Center) -->
  <g transform="translate(200, 365)">
    <!-- Legs -->
    <path d="M -12 2 Q -20 5 -15 12 M -8 5 Q -15 10 -10 16" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 12 2 Q 20 5 15 12 M 8 5 Q 15 10 10 16" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Claws -->
    <path d="M -15 -5 Q -25 -15 -15 -20 Q -5 -15 -10 -5 Z" fill="#ef4444"/>
    <path d="M 15 -5 Q 25 -15 15 -20 Q 5 -15 10 -5 Z" fill="#ef4444"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    <!-- Eyes -->
    <line x1="-5" y1="-10" x2="-5" y2="-5" stroke="#ef4444" stroke-width="2"/>
    <line x1="5" y1="-10" x2="5" y2="-5" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-5" cy="-12" r="3" fill="#ffffff"/>
    <circle cx="5" cy="-12" r="3" fill="#ffffff"/>
    <circle cx="-5" cy="-12" r="1.5" fill="#1e293b"/>
    <circle cx="5" cy="-12" r="1.5" fill="#1e293b"/>
  </g>

  <!-- Big Starfish -->
  <use href="#starfish" x="150" y="330" transform="scale(1.5)"/>
  <use href="#starfish" x="350" y="370" transform="scale(1.2) rotate(20)"/>

  <!-- Foreground Corals & Seaweed -->
  <!-- Left Seaweed -->
  <path d="M 20 400 Q 10 330 30 280 Q 40 330 25 400 Z" fill="#4ade80" stroke="#059669" stroke-width="1"/>
  <path d="M 30 400 Q 40 350 60 300 Q 50 350 35 400 Z" fill="#34d399" stroke="#059669" stroke-width="1"/>
  
  <!-- Right Brain Coral & Seaweed -->
  <ellipse cx="320" cy="370" rx="35" ry="20" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M 295 365 Q 320 350 345 365 M 300 375 Q 320 385 340 375 M 310 365 Q 320 370 330 365" fill="none" stroke="#0f766e" stroke-width="2"/>
  
  <!-- Coral Branches -->
  <path d="M 370 370 Q 380 320 395 310 M 375 340 Q 360 310 350 300 M 382 340 Q 390 320 385 300" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>

  <!-- Scattered Shells -->
