<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Soft Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Wall Patterns -->
    <pattern id="stripesPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#fbcfe8" stroke-width="6"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#ffffff" stroke-width="6"/>
    </pattern>

    <pattern id="dotsPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#38bdf8"/>
    </pattern>

    <pattern id="starsPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <polygon points="10,2 12,7 17,7 13,10 15,15 10,12 5,15 7,10 3,7 8,7" fill="#fef08a"/>
    </pattern>

    <pattern id="brickPattern" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#fda4af"/>
      <path d="M 0 5 L 16 5 M 8 0 L 8 5 M 0 5 L 0 10 M 16 5 L 16 10" stroke="#fff" stroke-width="1.5"/>
    </pattern>

    <!-- Floor Wood Pattern -->
    <pattern id="woodPattern" width="20" height="8" patternUnits="userSpaceOnUse">
      <rect width="20" height="8" fill="#fde047"/>
      <path d="M 0 4 L 20 4 M 10 0 L 10 4 M 0 4 L 0 8" stroke="#eab308" stroke-width="1"/>
    </pattern>

    <!-- Shared Furniture Templates -->
    <g id="windowRound">
      <circle cx="0" cy="0" r="14" fill="#bae6fd" stroke="#ffffff" stroke-width="3"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g id="pottedPlant">
      <path d="M -6 10 L 6 10 L 8 0 L -8 0 Z" fill="#fb923c"/>
      <circle cx="-4" cy="-5" r="6" fill="#22c55e"/>
      <circle cx="4" cy="-6" r="7" fill="#16a34a"/>
      <circle cx="0" cy="-10" r="6" fill="#4ade80"/>
    </g>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Scenery / Trees Outside -->
  <circle cx="20" cy="220" r="35" fill="#86efac"/>
  <circle cx="380" cy="220" r="35" fill="#86efac"/>

  <!-- ==================== DOLLHOUSE OUTER STRUCTURE ==================== -->

  <!-- Roof Frame -->
  <polygon points="200,15 35,100 365,100" fill="#f43f5e"/>
  <!-- Roof Shingles/Tiles Pattern Lines -->
  <path d="M 200 15 L 35 100 M 200 15 L 365 100 M 200 35 L 70 100 M 200 35 L 330 100 M 200 55 L 105 100 M 200 55 L 295 100" stroke="#fb7185" stroke-width="3"/>
  <polygon points="200,20 45,98 355,98" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Chimney with Smoke -->
  <rect x="280" y="30" width="22" height="35" fill="url(#brickPattern)"/>
  <path d="M 291 25 Q 285 15 295 10 T 290 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Outer House Main Box Frame -->
  <rect x="40" y="98" width="320" height="282" fill="#ffffff" stroke="#f43f5e" stroke-width="6" rx="2"/>

  <!-- Interior Wall Dividing Lines (House Cutaway Grid) -->
  <!-- Horizontal Floors -->
  <rect x="43" y="185" width="314" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="43" y="275" width="314" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Vertical Divider Walls -->
  <rect x="195" y="98" width="10" height="187" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ==================== ROOM 1: ATTIC / BEDROOM (TOP) ==================== -->
  <g id="atticRoom">
    <!-- Wallpaper -->
    <polygon points="200,30 50,98 350,98" fill="url(#starsPattern)"/>
    <rect x="50" y="98" width="300" height="87" fill="url(#starsPattern)"/>

    <!-- Attic Round Window -->
    <use href="#windowRound" x="200" y="68"/>

    <!-- Bunk Bed / Canopy Bed (Left) -->
    <g transform="translate(60, 115)">
      <!-- Bed Frame -->
      <rect x="0" y="30" width="65" height="35" fill="#a855f7" rx="3"/>
      <!-- Mattress & Sheets -->
      <rect x="5" y="32" width="55" height="20" fill="#ffffff" rx="2"/>
      <rect x="20" y="38" width="40" height="24" fill="#38bdf8" rx="2"/>
      <!-- Pillow -->
      <rect x="7" y="35" width="14" height="10" fill="#f472b6" rx="2"/>
      <!-- Headboard & Posts -->
      <rect x="0" y="15" width="6" height="50" fill="#c084fc" rx="1"/>
      <rect x="59" y="15" width="6" height="50" fill="#c084fc" rx="1"/>
      <!-- Bunting Garland -->
      <path d="M 0 18 Q 30 30 65 18" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
      <polygon points="12,22 18,22 15,28" fill="#facc15"/>
      <polygon points="28,24 34,24 31,30" fill="#4ade80"/>
      <polygon points="44,22 50,22 47,28" fill="#f472b6"/>
    </g>

    <!-- Doll Figure (Sleeping/Sitting on Bed) -->
    <g transform="translate(100, 135)">
      <circle cx="8" cy="0" r="5" fill="#fde047"/> <!-- Head -->
      <path d="M 4 -3 Q 8 -7 12 -3" fill="#78350f"/> <!-- Hair -->
      <rect x="4" y="5" width="8" height="12" fill="#f472b6" rx="1"/> <!-- PJs -->
    </g>

    <!-- Cute Teddy Bear on Floor -->
    <g transform="translate(140, 162)">
      <circle cx="6" cy="6" r="6" fill="#b45309"/>
      <circle cx="2" cy="2" r="2" fill="#b45309"/>
      <circle cx="10" cy="2" r="2" fill="#b45309"/>
      <ellipse cx="6" cy="12" rx="7" ry="6" fill="#b45309"/>
      <circle cx="6" cy="7" r="2.5" fill="#fde047"/>
    </g>

    <!-- Wardrobe / Clothes Closet (Right) -->
    <g transform="translate(285, 110)">
      <rect x="0" y="0" width="55" height="72" fill="#fb7185" rx="3"/>
      <rect x="4" y="4" width="22" height="64" fill="#fda4af" rx="1"/>
      <rect x="29" y="4" width="22" height="64" fill="#fda4af" rx="1"/>
      <!-- Handles -->
      <circle cx="22" cy="36" r="2" fill="#fef08a"/>
      <circle cx="33" cy="36" r="2" fill="#fef08a"/>
    </g>

    <!-- Small Rug -->
    <ellipse cx="200" cy="178" rx="30" ry="6" fill="#f472b6" opacity="0.8"/>
  </g>

  <!-- ==================== ROOM 2: BATHROOM (MIDDLE LEFT) ==================== -->
  <g id="bathroom">
    <!-- Wallpaper -->
    <rect x="50" y="195" width="145" height="80" fill="url(#dotsPattern)"/>
    <rect x="50" y="265" width="145" height="10" fill="#93c5fd"/> <!-- Tile Baseboard -->

    <!-- Bathtub with Bubbles -->
    <g transform="translate(60, 225)">
      <!-- Tub Base & Legs -->
      <path d="M 10 30 L 15 35 M 65 30 L 60 35" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 10 Q 0 30 15 30 L 60 30 Q 75 30 75 10 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="-4" y="5" width="83" height="7" fill="#ffffff" rx="3" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Faucet -->
      <path d="M 5 5 L 5 -3 Q 5 -8 10 -8" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Bubbles -->
      <circle cx="20" cy="3" r="6" fill="#e0f2fe" opacity="0.8"/>
      <circle cx="30" cy="0" r="8" fill="#e0f2fe" opacity="0.8"/>
      <circle cx="42" cy="4" r="5" fill="#e0f2fe" opacity="0.8"/>
      <circle cx="52" cy="2" r="7" fill="#e0f2fe" opacity="0.8"/>
      <!-- Rubber Ducky -->
      <circle cx="35" cy="-2" r="3.5" fill="#facc15"/>
      <circle cx="37" cy="-3" r="1" fill="#000000"/>
      <polygon points="38.5,-2 41,-1 38.5,0" fill="#f97316"/>
    </g>

    <!-- Vanity Mirror & Sink -->
    <g transform="translate(150, 215)">
      <!-- Oval Mirror -->
      <ellipse cx="15" cy="12" rx="10" ry="14" fill="#bae6fd" stroke="#f472b6" stroke-width="3"/>
      <!-- Sink -->
      <rect x="2" y="32" width="26" height="18" fill="#ffffff" stroke="#cbd5e1" rx="2"/>
      <rect x="12" y="50" width="6" height="15" fill="#ffffff" stroke="#cbd5e1"/>
    </g>
  </g>

  <!-- ==================== ROOM 3: CRAFT / PLAYROOM (MIDDLE RIGHT) ==================== -->
  <g id="playroom">
    <!-- Wallpaper -->
    <rect x="205" y="195" width="145" height="80" fill="url(#stripesPattern)"/>
    <rect x="205" y="265" width="145" height="10" fill="url(#woodPattern)"/>

    <!-- Window -->
    <rect x="290" y="205" width="30" height="35" fill="#bae6fd" stroke="#ffffff" stroke-width="3" rx="2"/>
    <line x1="290" y1="222" x2="320" y2="222" stroke="#ffffff" stroke-width="2"/>
    <line x1="305" y1="205" x2="305" y2="240" stroke="#ffffff" stroke-width="2"/>

    <!-- Mini Toy Dollhouse inside the Dollhouse! -->
    <g transform="translate(215, 235)">
      <polygon points="12,0 0,12 24,12" fill="#ef4444"/>
      <rect x="2" y="12" width="20" height="18" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
      <rect x="5" y="15" width="5" height="5" fill="#38bdf8"/>
      <rect x="14" y="15" width="5" height="5" fill="#38bdf8"/>
      <rect x="9" y="22" width="6" height="8" fill="#f97316"/>
    </g>

    <!-- Easel with Painting -->
    <g transform="translate(250, 220)">
      <line x1="12" y1="0" x2="2" y2="50" stroke="#78350f" stroke-width="2.5"/>
      <line x1="12" y1="0" x2="22" y2="50" stroke="#78350f" stroke-width="2.5"/>
      <line x1="12" y1="10" x2="12" y2="50" stroke="#92400e" stroke-width="2"/>
      <!-- Canvas -->
      <rect x="0" y="12" width="24" height="20" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="12" cy="22" r="6" fill="#f43f5e"/> <!-- Painted Rainbow/Flower -->
      <circle cx="12" cy="22" r="3" fill="#facc15"/>
    </g>

    <!-- Standing Girl Doll playing -->
    <g transform="translate(280, 232)">
      <circle cx="8" cy="0" r="5" fill="#fde047"/>
      <path d="M 2 -2 Q 8 -8 14 -2 Q 16 6 14 10" fill="#b45309"/> <!-- Brown Hair -->
      <polygon points="8,5 1,20 15,20" fill="#4ade80"/> <!-- Dress -->
      <rect x="5" y="20" width="2" height="8" fill="#fde047"/>
      <rect x="9" y="20" width="2" height="8" fill="#fde047"/>
    </g>

    <use href="#pottedPlant" x="335" y="255"/>
  </g>

  <!-- ==================== ROOM 4: KITCHEN / DINING (BOTTOM LEFT) ==================== -->
  <g id="kitchen">
    <!-- Back Wall & Flooring -->
    <rect x="50" y="285" width="145" height="80" fill="#fef3c7"/>
    <rect x="50" y="365" width="145" height="10" fill="url(#woodPattern)"/>

    <!-- Refrigerator -->
    <g transform="translate(55, 295)">
      <rect x="0" y="0" width="30" height="68" fill="#38bdf8" rx="3"/>
      <line x1="0" y1="25" x2="30" y2="25" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="4" y="8" width="3" height="10" fill="#ffffff" rx="1"/>
      <rect x="4" y="32" width="3" height="15" fill="#ffffff" rx="1"/>
      <!-- Cute Fridge Magnet -->
      <circle cx="20" cy="12" r="2.5" fill="#f43f5e"/>
    </g>

    <!-- Stove & Oven Counter -->
    <g transform="translate(90, 315)">
      <rect x="0" y="0" width="40" height="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="2"/>
      <!-- Cooktop Burners -->
      <rect x="0" y="-3" width="40" height="3" fill="#94a3b8"/>
      <ellipse cx="10" cy="-3" rx="5" ry="1" fill="#1e293b"/>
      <ellipse cx="30" cy="-3" rx="5" ry="1" fill="#1e293b"/>
      <!-- Oven Door -->
      <rect x="5" y="15" width="30" height="25" fill="#334155" rx="2"/>
      <rect x="8" y="18" width="24" height="14" fill="#fef08a" opacity="0.8"/> <!-- Oven Light -->
      <line x1="12" y1="8" x2="28" y2="8" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Dining Table & Chair -->
    <g transform="translate(140, 325)">
      <!-- Chair Left -->
      <rect x="0" y="5" width="4" height="32" fill="#fb923c"/>
      <rect x="0" y="18" width="10" height="3" fill="#fb923c"/>
      <rect x="8" y="21" width="3" height="16" fill="#fb923c"/>

      <!-- Table -->
      <rect x="12" y="12" width="38" height="5" fill="#f97316" rx="1"/>
      <rect x="16" y="17" width="4" height="22" fill="#fb923c"/>
      <rect x="42" y="17" width="4" height="22" fill="#fb923c"/>

      <!-- Cake on Table -->
      <path d="M 24 12 L 38 12 L 38 4 L 24 4 Z" fill="#f472b6"/>
      <circle cx="31" cy="2" r="2" fill="#ef4444"/> <!-- Cherry -->
    </g>
  </g>

  <!-- ==================== ROOM 5: LIVING ROOM (BOTTOM RIGHT) ==================== -->
  <g id="livingRoom">
    <!-- Back Wall & Flooring -->
    <rect x="205" y="285" width="145" height="80" fill="#ccfbf1"/>
    <rect x="205" y="365" width="145" height="10" fill="url(#woodPattern)"/>

    <!-- Large Framed Picture / TV -->
    <g transform="translate(240, 295)">
      <rect x="0" y="0" width="45" height="30" fill="#fef08a" stroke="#f59e0b" stroke-width="3" rx="2"/>
      <!-- Painting Scene (Sun & Hill) -->
      <circle cx="32" cy="10" r="5" fill="#f97316"/>
      <path d="M 5 25 Q 20 15 40 25 Z" fill="#22c55e"/>
    </g>

    <!-- Cozy Sofa / Couch -->
    <g transform="translate(225, 325)">
      <!-- Backrest -->
      <rect x="0" y="0" width="70" height="25" fill="#a855f7" rx="4"/>
      <!-- Cushions -->
      <rect x="5" y="12" width="28" height="18" fill="#c084fc" rx="3"/>
      <rect x="37" y="12" width="28" height="18" fill="#c084fc" rx="3"/>
      <!-- Armrests -->
      <rect x="-4" y="8" width="10" height="22" fill="#9333ea" rx="3"/>
      <rect x="64" y="8" width="10" height="22" fill="#9333ea" rx="3"/>
      <!-- Legs -->
      <rect x="0" y="28" width="4" height="8" fill="#78350f"/>
      <rect x="66" y="28" width="4" height="8" fill="#78350f"/>

      <!-- Throw Pillow -->
      <rect x="8" y="8" width="10" height="10" fill="#fde047" transform="rotate(15)" rx="1"/>
    </g>

    <!-- Floor Lamp -->
    <g transform="translate(212, 310)">
      <path d="M 0 0 L 16 0 L 20 20 L -4 20 Z" fill="#f43f5e"/> <!-- Shade -->
      <line x1="8" y1="20" x2="8" y2="60" stroke="#cbd5e1" stroke-width="2.5"/> <!-- Pole -->
      <ellipse cx="8" cy="60" rx="8" ry="3" fill="#94a3b8"/> <!-- Base -->
    </g>

    <!-- Standing Boy Doll -->
    <g transform="translate(305, 325)">
      <circle cx="8" cy="0" r="5" fill="#fde047"/>
      <path d="M 3 -3 Q 8 -8 13 -3" fill="#78350f"/> <!-- Hair -->
      <rect x="4" y="5" width="8" height="12" fill="#3b82f6" rx="1"/> <!-- Shirt -->
      <rect x="4" y="17" width="3" height="10" fill="#1e293b"/> <!-- Pants -->
      <rect x="9" y="17" width="3" height="10" fill="#1e293b"/>
    </g>

    <!-- Kitty Cat sleeping on Rug -->
    <g transform="translate(260, 360)">
      <ellipse cx="12" cy="4" rx="18" ry="6" fill="#f472b6"/> <!-- Rug -->
      <!-- Sleeping Cat -->
      <ellipse cx="12" cy="2" rx="7" ry="5" fill="#f97316"/>
      <circle cx="17" cy="0" r="3.5" fill="#f97316"/>
      <path d="M 5 3 Q 0 8 2 0" fill="none" stroke="#f97316" stroke-width="2"/> <!-- Tail -->
    </g>
  </g>

  <!-- ==================== FRONT BUSHES & DECORATIONS ==================== -->
  <g id="frontYard">
    <path d="M 30 380 Q 50 365 70 380 Q 90 365 110 380 L 110 395 L 30 395 Z" fill="#4ade80"/>
    <path d="M 290 380 Q 310 365 330 380 Q 350 365 370 380 L 370 395 L 290 395 Z" fill="#4ade80"/>
    <!-- Flowers in Bushes -->
    <circle cx="50" cy="375" r="3" fill="#f43f5e"/>
    <circle cx="90" cy="373" r="3" fill="#facc15"/>
    <circle cx="310" cy="373" r="3" fill="#f43f5e"/>
    <circle cx="350" cy="375" r="3" fill="#38bdf8"/>
  </g>

</svg>
