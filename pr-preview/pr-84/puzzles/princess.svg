<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <!-- Castle Gradients -->
    <linearGradient id="castlePink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="goldDome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Road/Pathway Gradient -->
    <linearGradient id="pathwayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Carriage Gradients -->
    <linearGradient id="carriageBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="carriageGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Dress Gradient -->
    <linearGradient id="dressSparkle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Leaf Pattern -->
    <pattern id="leafPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#22c55e"/>
      <path d="M 5 5 Q 10 0 15 5 T 25 5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <path d="M 5 15 Q 10 10 15 15 T 25 15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    </pattern>

    <!-- Reusable Items -->
    <!-- Turret Top Template -->
    <g id="turret">
      <path d="M -15 20 Q -15 0 0 -20 Q 15 0 15 20 Z" fill="url(#goldDome)" stroke="#ca8a04" stroke-width="1.5"/>
      <line x1="0" y1="-20" x2="0" y2="-32" stroke="#eab308" stroke-width="1.5"/>
      <polygon points="0,-32 10,-28 0,-24" fill="#06b6d4" stroke="#0e7490" stroke-width="1"/>
    </g>

    <!-- Flower Template -->
    <g id="flower">
      <circle cx="-3" cy="0" r="2.5" fill="#f472b6"/>
      <circle cx="3" cy="0" r="2.5" fill="#f472b6"/>
      <circle cx="0" cy="-3" r="2.5" fill="#f472b6"/>
      <circle cx="0" cy="3" r="2.5" fill="#f472b6"/>
      <circle cx="0" cy="0" r="2" fill="#fef08a"/>
    </g>

    <!-- Tree Template -->
    <g id="tree">
      <rect x="0" y="30" width="10" height="25" fill="#78350f" rx="3"/>
      <circle cx="5" cy="20" r="20" fill="url(#leafPattern)"/>
      <circle cx="-5" cy="15" r="14" fill="#16a34a" opacity="0.8"/>
    </g>
  </defs>

  <!-- ==================== BACKGROUND & SKY ==================== -->
  <rect width="400" height="400" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun with Cute Face -->
  <g transform="translate(340, 50)">
    <circle r="22" fill="#facc15"/>
    <path d="M 0 -28 L 0 -24 M 0 24 L 0 28 M -28 0 L -24 0 M 24 0 L 28 0 M -20 -20 L -17 -17 M 17 17 L 20 20 M -20 20 L -17 17 M 17 -17 L 20 -20" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-3" r="2" fill="#1e293b"/>
    <circle cx="6" cy="-3" r="2" fill="#1e293b"/>
    <path d="M -5 5 Q 0 10 5 5" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-9" cy="2" r="2.5" fill="#f472b6" opacity="0.6"/>
    <circle cx="9" cy="2" r="2.5" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Clouds -->
  <path d="M 10 40 Q 25 25 45 30 Q 60 15 80 25 Q 95 20 105 35 Q 115 40 110 50 L 10 50 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 230 60 Q 240 50 255 50 Q 265 40 280 50 Q 295 45 305 55 Q 315 60 310 70 L 225 70 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Rainbow -->
  <g fill="none" stroke-width="4" opacity="0.8">
    <path d="M 260 140 Q 330 60 400 130" stroke="#f43f5e"/>
    <path d="M 260 144 Q 330 64 400 134" stroke="#fb923c"/>
    <path d="M 260 148 Q 330 68 400 138" stroke="#fde047"/>
    <path d="M 260 152 Q 330 72 400 142" stroke="#4ade80"/>
    <path d="M 260 156 Q 330 76 400 146" stroke="#38bdf8"/>
    <path d="M 260 160 Q 330 80 400 150" stroke="#c084fc"/>
  </g>

  <!-- Distant Purple Mountains with Gradient -->
  <path d="M 0 180 L 40 140 L 90 170 L 150 120 L 220 180 L 280 130 L 350 175 L 400 130 L 400 220 L 0 220 Z" fill="url(#mountainGrad)"/>

  <!-- Rolling Green Hills -->
  <path d="M 0 210 Q 120 160 240 210 T 400 190 L 400 400 L 0 400 Z" fill="#86efac"/>
  <path d="M 0 240 Q 160 190 320 230 T 400 250 L 400 400 L 0 400 Z" fill="#4ade80"/>

  <!-- Birds -->
  <path d="M 130 60 Q 135 52 140 60 Q 145 52 150 60" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 148 72 Q 152 66 156 72 Q 160 66 164 72" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ==================== PRINCESS CASTLE (CENTER) ==================== -->
  <g id="castle" transform="translate(110, 80)">
    <!-- Main Outer Castle Walls with Gradient -->
    <rect x="25" y="100" width="130" height="70" fill="url(#castlePink)"/>
    <rect x="25" y="92" width="130" height="8" fill="#db2777"/>
    <!-- Wall Crenellations (Merlons) -->
    <path d="M 25 92 L 33 92 L 33 86 L 41 86 L 41 92 L 49 92 L 49 86 L 57 86 L 57 92 L 123 92 L 123 86 L 131 86 L 131 92 L 139 92 L 139 86 L 147 86 L 147 92 L 155 92" fill="#db2777"/>

    <!-- Left Tower -->
    <rect x="0" y="70" width="35" height="100" fill="url(#castlePink)"/>
    <rect x="-3" y="65" width="41" height="8" fill="#db2777"/>
    <use href="#turret" x="17.5" y="65"/>

    <!-- Right Tower -->
    <rect x="145" y="70" width="35" height="100" fill="url(#castlePink)"/>
    <rect x="142" y="65" width="41" height="8" fill="#db2777"/>
    <use href="#turret" x="162.5" y="65"/>

    <!-- Center Tall Grand Tower -->
    <rect x="60" y="40" width="60" height="100" fill="url(#castlePink)"/>
    <rect x="56" y="34" width="68" height="8" fill="#db2777"/>
    <!-- Grand Center Spire Dome -->
    <use href="#turret" x="90" y="34" transform="scale(1.4)" transform-origin="90 34"/>

    <!-- Windows -->
    <path d="M 15 90 A 8 8 0 0 1 30 90 L 30 105 L 15 105 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 150 90 A 8 8 0 0 1 165 90 L 165 105 L 150 105 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 80 55 A 10 10 0 0 1 100 55 L 100 75 L 80 75 Z" fill="#fef08a" stroke="#ffffff" stroke-width="2"/>
    <line x1="90" y1="45" x2="90" y2="75" stroke="#db2777" stroke-width="1.5"/>
    <line x1="80" y1="62" x2="100" y2="62" stroke="#db2777" stroke-width="1.5"/>

    <!-- Castle Gate Door -->
    <path d="M 70 170 A 20 20 0 0 1 110 170 L 110 170 L 70 170 Z" fill="#78350f"/>
    <path d="M 72 170 A 18 18 0 0 1 108 170" fill="none" stroke="#fde047" stroke-width="2"/>
    <line x1="90" y1="150" x2="90" y2="170" stroke="#571c05" stroke-width="2"/>
  </g>

  <!-- Winding Rainbow Stone Pathway with Gradient Base -->
  <path d="M 200 250 Q 190 280 230 310 T 160 400 L 230 400 Q 280 340 230 290 Q 210 270 200 250 Z" fill="url(#pathwayGrad)" opacity="0.8"/>
  <g fill="none" stroke="#f472b6" stroke-width="2" opacity="0.6">
    <path d="M 195 260 Q 215 265 205 270"/>
    <path d="M 200 280 Q 230 285 220 295"/>
    <path d="M 210 310 Q 250 320 220 335"/>
    <path d="M 180 350 Q 230 360 200 375"/>
  </g>

  <!-- ==================== ROYAL CARRIAGE (RIGHT) ==================== -->
  <g id="carriage" transform="translate(260, 220)">
    <!-- Wheels -->
    <circle cx="15" cy="45" r="16" fill="none" stroke="#eab308" stroke-width="3"/>
    <circle cx="15" cy="45" r="4" fill="#ca8a04"/>
    <path d="M 15 29 L 15 61 M -1 45 L 31 45 M 4 34 L 26 56 M 4 56 L 26 34" stroke="#eab308" stroke-width="1.5"/>

    <circle cx="75" cy="45" r="20" fill="none" stroke="#eab308" stroke-width="3.5"/>
    <circle cx="75" cy="45" r="5" fill="#ca8a04"/>
    <path d="M 75 25 L 75 65 M 55 45 L 95 45 M 61 31 L 89 59 M 61 59 L 89 31" stroke="#eab308" stroke-width="1.5"/>

    <!-- Carriage Body (Pumpkin Style) with Gradient -->
    <rect x="20" y="5" width="50" height="40" rx="20" fill="url(#carriageBlue)" stroke="#1d4ed8" stroke-width="2"/>
    <path d="M 30 5 Q 45 0 60 5 Q 65 25 60 45 Q 45 50 30 45 Q 25 25 30 5 Z" fill="#7dd3fc"/>
    <!-- Crown on Top of Carriage with Gradient -->
    <path d="M 40 2 L 42 -5 L 45 -1 L 48 -5 L 50 2 Z" fill="url(#carriageGold)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Window & Curtains -->
    <circle cx="45" cy="22" r="11" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
    <path d="M 34 22 Q 40 13 45 22 Q 50 13 56 22 Z" fill="#f472b6"/>

    <!-- Driver Bench & Lamp -->
    <rect x="68" y="18" width="12" height="5" fill="#78350f"/>
    <circle cx="12" cy="15" r="4" fill="#fde047" stroke="#eab308" stroke-width="1"/>
  </g>

  <!-- ==================== WATER FOUNTAIN (LEFT) - SCALED UP ==================== -->
  <g id="fountain" transform="translate(-10, 260) scale(1.4)">
    <!-- Outer Pool -->
    <ellipse cx="35" cy="40" rx="35" ry="12" fill="#38bdf8" stroke="#bae6fd" stroke-width="3"/>
    <ellipse cx="35" cy="38" rx="28" ry="8" fill="#0284c7"/>

    <!-- Pedestal & Tiers -->
    <rect x="30" y="15" width="10" height="25" fill="#e2e8f0"/>
    <ellipse cx="35" cy="20" rx="18" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="35" cy="18" rx="14" ry="4" fill="#38bdf8"/>

    <!-- Water Streams -->
    <path d="M 35 18 Q 20 -5 10 22 M 35 18 Q 50 -5 60 22 M 35 18 Q 30 -10 22 20 M 35 18 Q 40 -10 48 20" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ==================== THE PRINCESS (HERO CHARACTER) ==================== -->
  <g id="princess" transform="translate(130, 215)">
    <!-- LONG HAIR - MOVED BEHIND -->
    <path d="M 19 16 Q 12 5 22 2 Q 32 0 42 2 Q 52 5 45 16 C 52 28 48 45 44 55 Q 32 48 20 55 C 16 45 12 28 19 16 Z" fill="#78350f"/>

    <!-- Sparkle Aura around Princess -->
    <circle cx="-10" cy="40" r="12" fill="#ffffff" opacity="0.1"/>
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff" transform="translate(-10 40) scale(1.2)"/>
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff" transform="translate(75 30)"/>
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#ffffff" transform="translate(70 85) scale(0.8)"/>

    <!-- Ballgown Skirt with Gradient -->
    <path d="M 32 60 Q -15 110 5 130 Q 32 135 60 130 Q 80 110 32 60 Z" fill="url(#dressSparkle)"/>

    <!-- Dress Peplum / Side Swags -->
    <path d="M 32 60 Q 5 80 -2 100 Q 20 105 32 80 Z" fill="#bae6fd"/>
    <path d="M 32 60 Q 60 80 66 100 Q 44 105 32 80 Z" fill="#bae6fd"/>

    <!-- Inner Dress Pink Petticoat Layer -->
    <path d="M 12 110 Q 32 90 52 110 Q 32 138 12 110 Z" fill="#f472b6"/>
    <!-- Little Bows on Skirt -->
    <circle cx="32" cy="80" r="3" fill="#f43f5e"/>
    <circle cx="2" cy="100" r="2.5" fill="#f43f5e"/>
    <circle cx="62" cy="100" r="2.5" fill="#f43f5e"/>

    <!-- Bodice / Torso -->
    <path d="M 22 38 L 42 38 L 40 62 L 24 62 Z" fill="#1d4ed8"/>
    <path d="M 25 38 Q 32 48 39 38 Z" fill="#f472b6"/> <!-- Inset V-Neck -->

    <!-- Puff Sleeves -->
    <circle cx="18" cy="38" r="7" fill="#bae6fd"/>
    <circle cx="46" cy="38" r="7" fill="#bae6fd"/>

    <!-- Arms & Hands -->
    <!-- Left Arm Waving -->
    <path d="M 15 40 Q 0 30 -5 18" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-5" cy="17" r="3" fill="#fde047"/> <!-- Hand -->
    <!-- Right Arm Holding Magic Wand -->
    <path d="M 48 40 Q 58 48 62 35" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="62" cy="34" r="3" fill="#fde047"/>

    <!-- Magic Wand & Star -->
    <line x1="62" y1="35" x2="72" y2="15" stroke="#eab308" stroke-width="2"/>
    <polygon points="72,10 74,14 79,15 75,18 76,23 72,20 68,23 69,18 65,15 70,14" fill="#facc15"/>

    <!-- Head & Neck -->
    <rect x="29" y="28" width="6" height="12" fill="#fde047"/> <!-- Neck -->
    <ellipse cx="32" cy="20" rx="13" ry="12" fill="#fde047" stroke="#92400e" stroke-width="0.8"/> <!-- Face refined -->

    <!-- Hair Bangs Front - REFINED -->
    <path d="M 20 14 Q 28 18 32 14 Q 38 18 44 14 Q 32 8 20 14 Z" fill="#92400e" stroke="#78350f" stroke-width="0.5"/>

    <!-- Eyes & Smile -->
    <ellipse cx="27" cy="18" rx="2" ry="3" fill="#1e293b"/>
    <ellipse cx="37" cy="18" rx="2" ry="3" fill="#1e293b"/>
    <circle cx="28" cy="17" r="0.8" fill="#ffffff"/> <!-- Eye Sparkle -->
    <circle cx="38" cy="17" r="0.8" fill="#ffffff"/>
    <!-- Rosy Cheeks -->
    <circle cx="23" cy="22" r="2.5" fill="#fb7185" opacity="0.6"/>
    <circle cx="41" cy="22" r="2.5" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 28 22 Q 32 27 36 22" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sparkling Gold Tiara / Crown -->
    <path d="M 22 10 L 24 2 L 28 7 L 32 0 L 36 7 L 40 2 L 42 10 Z" fill="url(#goldDome)" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="32" cy="4" r="1.5" fill="#ef4444"/> <!-- Crown Jewel -->
    <circle cx="25" cy="5" r="1" fill="#3b82f6"/>
    <circle cx="39" cy="5" r="1" fill="#3b82f6"/>
  </g>

  <!-- ==================== CUTE PETS & DETAILS ==================== -->

  <!-- Cute Royal Bunny (Bottom Right) -->
  <g id="bunny" transform="translate(290, 330)">
    <!-- Ears -->
    <ellipse cx="8" cy="-8" rx="3" ry="10" fill="#ffffff" stroke="#cbd5e1" transform="rotate(-10 8 -8)"/>
    <ellipse cx="8" cy="-8" rx="1.5" ry="7" fill="#f472b6"/>
    <ellipse cx="18" cy="-8" rx="3" ry="10" fill="#ffffff" stroke="#cbd5e1" transform="rotate(10 18 -8)"/>
    <ellipse cx="18" cy="-8" rx="1.5" ry="7" fill="#f472b6"/>
    <!-- Body & Head -->
    <circle cx="13" cy="18" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="13" cy="6" r="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Face -->
    <circle cx="10" cy="5" r="1" fill="#1e293b"/>
    <circle cx="16" cy="5" r="1" fill="#1e293b"/>
    <polygon points="12,7 14,7 13,8.5" fill="#f472b6"/>
    <!-- Mini Gold Crown for Bunny -->
    <polygon points="10,0 13,-4 16,0" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
  </g>

  <!-- Cute Royal Kitten with Crown (Bottom Left) -->
  <g id="kitty" transform="translate(85, 340)">
    <!-- Tail -->
    <path d="M 22 15 Q 30 10 28 0" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <!-- Body & Head -->
    <ellipse cx="14" cy="14" rx="9" ry="7" fill="#f97316" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="10" cy="5" r="6.5" fill="#f97316" stroke="#ca8a04" stroke-width="1"/>
    <!-- Ears -->
    <polygon points="5,1 8,-4 10,1" fill="#f97316"/>
    <polygon points="11,1 13,-4 16,1" fill="#f97316"/>
    <!-- Face -->
    <circle cx="8" cy="4" r="1" fill="#1e293b"/>
    <circle cx="12" cy="4" r="1" fill="#1e293b"/>
    <polygon points="9.5,6 10.5,6 10,7" fill="#f472b6"/>
  </g>

  <!-- ==================== FOREGROUND FLOWERS & BUSHES ==================== -->
  <g id="flowerBed">
    <!-- Bushes Bottom Edge with Leaf Pattern -->
    <path d="M -10 370 Q 15 350 40 370 Q 65 350 90 370 L 90 410 L -10 410 Z" fill="url(#leafPattern)" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M 310 370 Q 335 350 360 370 Q 385 350 410 370 L 410 410 L 310 410 Z" fill="url(#leafPattern)" stroke="#16a34a" stroke-width="1.5"/>

    <!-- Flowers Scattered -->
    <use href="#flower" x="15" y="375"/>
    <use href="#flower" x="40" y="368" transform="scale(1.2)"/>
    <use href="#flower" x="65" y="378"/>

    <use href="#flower" x="325" y="375"/>
    <use href="#flower" x="350" y="365" transform="scale(1.3)"/>
    <use href="#flower" x="380" y="378"/>
  </g>

  <!-- ==================== SCALED-UP FOREGROUND ITEMS ==================== -->
  <!-- Larger Tree Right -->
  <use href="#tree" x="330" y="270" transform="scale(1.5)"/>
  <!-- Larger Tree Left -->
  <use href="#tree" x="15" y="290" transform="scale(1.3)"/>

</svg>
